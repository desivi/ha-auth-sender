---
name: HA Auth Sender
version: "1.0.2"
slug: ha_auth_sender
description: >-
  Forwards Home Assistant authentication events to a remote syslog receiver
  over RFC3164/UDP, with credential redaction and content-hash deduplication.
url: https://github.com/desivi/ha-auth-sender
arch:
  - aarch64
  - amd64
stage: experimental
startup: services
boot: auto
init: false
hassio_api: true
hassio_role: manager
homeassistant_api: false
host_network: false
ingress: false
map: []
options:
  syslog_host: 192.168.0.20
  syslog_port: "1514"
  poll_interval: "20"
  app_name: ha-auth
  log_host: homeassistant
  bootstrap: sa
schema:
  syslog_host: str
  syslog_port: port
  poll_interval: "int(5,30)"
  app_name: str
  log_host: str
  bootstrap: list(sa|send)
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Internal watchdog health check. Not published to the host.
watchdog: http://[HOST]:[PORT:8099]/
